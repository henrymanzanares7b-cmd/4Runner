              <div className="relative w-full h-full flex items-center justify-center group">
                <img
                  src={typeof file === 'string' ? file : srcOf(file)}
                  alt={label}
                  className="max-h-full max-w-full object-contain rounded-xl shadow-md"
                />
                <div className="absolute inset-0 bg-black/60 opacity-0 group-hover:opacity-100 transition-opacity rounded-xl flex items-center justify-center">
                  <span className="text-xs text-white font-medium bg-black/50 px-3 py-1.5 rounded-full backdrop-blur-sm">
                    Cambiar imagen
                  </span>
                </div>
                <div className="absolute top-2 right-2 bg-emerald-500 text-white rounded-full p-1 shadow-md">
                  <CheckCircleIcon className="w-4 h-4" />
                </div>
              </div>
            ) : (
              <div className="flex flex-col items-center text-center p-4">
                <div className={`w-12 h-12 rounded-2xl flex items-center justify-center mb-3 ${isDark ? 'bg-indigo-500/10 text-indigo-400' : 'bg-indigo-50 text-indigo-600'}`}>
                  <UploadCloudIcon className="w-6 h-6" />
                </div>
                <p className="text-xs font-medium mb-1">Arrastra tu imagen aquí</p>
                <p className={`text-[11px] ${isDark ? 'text-gray-500' : 'text-gray-400'}`}>o haz clic para explorar en tu dispositivo</p>
              </div>
            )}
          </div>
        </div>
      );
    };

    function App() {
      const fb = useRef({ sdk: null, auth: null, db: null });
      const [fbReady, setFbReady] = useState(false);
      const [user, setUser] = useState(null);
      const [profile, setProfile] = useState(null);
      const [settings, setSettings] = useState(DEFAULT_SETTINGS);
      const [settingsDraft, setSettingsDraft] = useState(DEFAULT_SETTINGS);
      const [savingSettings, setSavingSettings] = useState(false);

      const [showAuthModal, setShowAuthModal] = useState(false);
      const [authMode, setAuthMode] = useState('login');
      const [authName, setAuthName] = useState('');
      const [authEmail, setAuthEmail] = useState('');
      const [authPassword, setAuthPassword] = useState('');
      const [authError, setAuthError] = useState(null);
      const [authBusy, setAuthBusy] = useState(false);
      const pendingNameRef = useRef('');

      const [activeTab, setActiveTab] = useState('studio');
      const [adminSection, setAdminSection] = useState('catalog');
      const [isDark, setIsDark] = useState(true);
      const [apiKeyInput, setApiKeyInput] = useState("");
      const [showKeyModal, setShowKeyModal] = useState(false);

      const [catalogItems, setCatalogItems] = useState(DEFAULT_CATALOG);
      const [usingFallback, setUsingFallback] = useState(true);
      const [selectedCategory, setSelectedCategory] = useState('all');
      const [searchQuery, setSearchQuery] = useState('');
      const [adminSearch, setAdminSearch] = useState('');

      const [showGarmentModal, setShowGarmentModal] = useState(false);
      const [editingItem, setEditingItem] = useState(null);
      const [form, setForm] = useState(EMPTY_FORM);
      const [savingGarment, setSavingGarment] = useState(false);
      const [deleteTarget, setDeleteTarget] = useState(null);
      const [seeding, setSeeding] = useState(false);

      const [usersList, setUsersList] = useState([]);
      const [allTryons, setAllTryons] = useState([]);
      const [stores, setStores] = useState([]);
      const [storeFilter, setStoreFilter] = useState('all');
      const [showStoreModal, setShowStoreModal] = useState(false);
      const [editingStore, setEditingStore] = useState(null);
      const [storeForm, setStoreForm] = useState(EMPTY_STORE);
      const [savingStore, setSavingStore] = useState(false);
      const [deleteStoreTarget, setDeleteStoreTarget] = useState(null);
      const [myTryons, setMyTryons] = useState([]);
      const [profileName, setProfileName] = useState('');
      const [profileSize, setProfileSize] = useState('');
      const [savingProfile, setSavingProfile] = useState(false);

      const [modelImage, setModelImage] = useState(null);
      const [outfit, setOutfit] = useState([]);
      const [uploadCategory, setUploadCategory] = useState('top');
      const [showSilhouette, setShowSilhouette] = useState(false);
      const [showCamera, setShowCamera] = useState(false);
      const [isGenerating, setIsGenerating] = useState(false);
      const [progress, setProgress] = useState(0);
      const [progressStatus, setProgressStatus] = useState("Analizando imágenes...");
      const [resultImage, setResultImage] = useState(null);
      const [errorMessage, setErrorMessage] = useState(null);
      const [lastMethod, setLastMethod] = useState(null);
      const [fitStatus, setFitStatus] = useState('idle');
      const [autoFit, setAutoFit] = useState(true);
      const [removeBg, setRemoveBg] = useState(true);


      const [toastMessage, setToastMessage] = useState(null);
      const toastTimer = useRef(null);

      const poseRef = useRef({ key: null, pose: null });
      const bodyRef = useRef({ key: null, body: null });
      const garmentCacheRef = useRef(new Map());
      const layerUid = useRef(0);
      const renderTokenRef = useRef(0);
      const hasResultRef = useRef(false);

      const isAdmin = !!user && (profile?.role === 'admin' || isAdminEmail(user.email));

      const money = (value) => new Intl.NumberFormat('es-SV', {
        style: 'currency', currency: 'USD'
      }).format(Number(value || 0));

      const showToast = (msg) => {
        setToastMessage(msg);
        clearTimeout(toastTimer.current);
        toastTimer.current = setTimeout(() => setToastMessage(null), 3200);
      };

      const permissionText = (err) => (err && err.code === 'permission-denied')
        ? 'No tienes permiso para esto. Revisa que tu cuenta sea admin y que las reglas de Firestore estén publicadas.'
        : null;

      // ===== Conexión con Firebase =====
      useEffect(() => {
        const unsubs = [];
        const setup = () => {
          const sdk = getFirebase();
          if (!sdk.initializeApp || fb.current.db) return;
          try {
            const app = sdk.initializeApp(firebaseConfig);
            try { if (sdk.getAnalytics) sdk.getAnalytics(app); } catch (e) {}
            const auth = sdk.getAuth(app);
            const db = sdk.getFirestore(app);
            fb.current = { sdk, auth, db };
            setFbReady(true);

            unsubs.push(sdk.onSnapshot(sdk.collection(db, 'garments'), (snap) => {
              const items = [];
              snap.forEach((d) => items.push({ id: d.id, ...d.data() }));
              if (items.length === 0) {
                setUsingFallback(true);
                setCatalogItems(DEFAULT_CATALOG);
              } else {
                items.sort((a, b) => String(b.createdAt || '').localeCompare(String(a.createdAt || '')));
                setUsingFallback(false);
                setCatalogItems(items);
              }
            }, (err) => {
              console.warn('Catálogo:', err);
              setUsingFallback(true);
              setCatalogItems(DEFAULT_CATALOG);
            }));

            unsubs.push(sdk.onSnapshot(sdk.collection(db, 'stores'), (snap) => {
              const list = [];
              snap.forEach((d) => list.push({ id: d.id, ...d.data() }));
              list.sort((a, b) => (a.name || '').localeCompare(b.name || ''));
              setStores(list);
            }, (err) => console.warn('Tiendas:', err)));

            unsubs.push(sdk.onSnapshot(sdk.doc(db, 'settings', 'app'), (snap) => {
              if (snap.exists()) setSettings({ ...DEFAULT_SETTINGS, ...snap.data() });
            }, (err) => console.warn('Ajustes:', err)));

            unsubs.push(sdk.onAuthStateChanged(auth, (currentUser) => {
              setUser(currentUser && !currentUser.isAnonymous ? currentUser : null);
            }));
          } catch (e) {
            console.warn('Firebase:', e);
          }
        };

        if (window.FirebaseSDK) setup();
        else window.addEventListener('firebase-sdk-ready', setup);
        return () => {
          window.removeEventListener('firebase-sdk-ready', setup);
          unsubs.forEach((u) => u && u());
        };
      }, []);

      // Perfil del usuario conectado (se crea la primera vez que entra)
      useEffect(() => {
        const { sdk, db } = fb.current;
        if (!user || !db) { setProfile(null); setMyTryons([]); return; }
        let cancelled = false;
        let unsubProfile = null;
        let unsubTryons = null;

        (async () => {
          const ref = sdk.doc(db, 'users', user.uid);
          const now = new Date().toISOString();
          try {
            const snap = await sdk.getDoc(ref);
            if (!snap.exists()) {
              await sdk.setDoc(ref, {
                uid: user.uid,
                email: user.email || '',
                displayName: user.displayName || pendingNameRef.current || '',
                role: isAdminEmail(user.email) ? 'admin' : 'user',
                preferredSize: '',
                createdAt: now,
                lastLogin: now
              });
            } else {
              const update = { lastLogin: now, email: user.email || '' };
              if (isAdminEmail(user.email) && snap.data().role !== 'admin') update.role = 'admin';
              await sdk.updateDoc(ref, update);
            }
          } catch (e) {
            console.warn('Perfil:', e);
          }
          if (cancelled) return;

          unsubProfile = sdk.onSnapshot(ref, (s) => {
            if (s.exists()) setProfile({ id: s.id, ...s.data() });
          }, (e) => console.warn('Perfil:', e));

          const q = sdk.query(sdk.collection(db, 'tryons'), sdk.where('userId', '==', user.uid));
          unsubTryons = sdk.onSnapshot(q, (snap) => {
            const list = [];
            snap.forEach((d) => list.push({ id: d.id, ...d.data() }));
            list.sort((a, b) => String(b.createdAt || '').localeCompare(String(a.createdAt || '')));
            setMyTryons(list);
          }, (e) => console.warn('Historial:', e));
        })();

        return () => {
          cancelled = true;
          if (unsubProfile) unsubProfile();
          if (unsubTryons) unsubTryons();
        };
      }, [user, fbReady]);

      // Datos que solo ve el admin
      useEffect(() => {
        const { sdk, db } = fb.current;
        if (!isAdmin || !db) { setUsersList([]); setAllTryons([]); return; }
        const u1 = sdk.onSnapshot(sdk.collection(db, 'users'), (snap) => {
          const list = [];
          snap.forEach((d) => list.push({ id: d.id, ...d.data() }));
          list.sort((a, b) => String(a.createdAt || '').localeCompare(String(b.createdAt || '')));
          setUsersList(list);
        }, (e) => console.warn('Usuarios:', e));
        const u2 = sdk.onSnapshot(sdk.collection(db, 'tryons'), (snap) => {
          const list = [];
          snap.forEach((d) => list.push({ id: d.id, ...d.data() }));
          setAllTryons(list);
        }, (e) => console.warn('Pruebas:', e));
        return () => { u1(); u2(); };
      }, [isAdmin, fbReady]);

      useEffect(() => { setSettingsDraft(settings); }, [settings]);
      useEffect(() => { setAutoFit(settings.autoFitDefault); }, [settings.autoFitDefault]);
      useEffect(() => { setRemoveBg(settings.removeBgDefault); }, [settings.removeBgDefault]);
      useEffect(() => { document.title = `${settings.storeName || 'V-TryOn Studio'} - Probador Virtual`; }, [settings.storeName]);

      useEffect(() => {
        if (profile) {
          setProfileName(profile.displayName || '');
          setProfileSize(profile.preferredSize || '');
        }
      }, [profile]);

      useEffect(() => {
        if (activeTab === 'admin' && !isAdmin) setActiveTab('studio');
        if (activeTab === 'profile' && !user) setActiveTab('studio');
      }, [activeTab, isAdmin, user]);

      // Precarga el detector de cuerpo en cuanto hay una foto
      useEffect(() => {
        if (modelImage && autoFit && window.PoseAPI) window.PoseAPI.preload();
      }, [modelImage, autoFit]);

      // ===== Sesión =====
      const authErrorText = (code) => ({
        'auth/invalid-email': 'El correo no tiene un formato válido.',
        'auth/invalid-credential': 'Correo o contraseña incorrectos.',
        'auth/wrong-password': 'Correo o contraseña incorrectos.',
        'auth/user-not-found': 'No existe una cuenta con ese correo.',
        'auth/email-already-in-use': 'Ese correo ya tiene una cuenta. Inicia sesión.',
        'auth/weak-password': 'La contraseña necesita al menos 6 caracteres.',
        'auth/too-many-requests': 'Demasiados intentos. Espera unos minutos y vuelve a probar.',
        'auth/operation-not-allowed': 'Activa el acceso con correo y contraseña en la consola de Firebase (Authentication).',
        'auth/network-request-failed': 'Sin conexión. Revisa tu internet.'
      }[code] || 'No se pudo completar. Intenta de nuevo.');

      const handleAuth = async (e) => {
        e.preventDefault();
        setAuthError(null);
        const { sdk, auth } = fb.current;
        if (!auth) { setAuthError('Firebase todavía está cargando. Espera un momento.'); return; }
        if (authMode === 'signup' && !settings.allowSignup && !isAdminEmail(authEmail)) {
          setAuthError('Los registros están cerrados por el administrador.');
          return;
        }
        setAuthBusy(true);
        try {
          if (authMode === 'login') {
            await sdk.signInWithEmailAndPassword(auth, authEmail.trim(), authPassword);
            showToast('Sesión iniciada.');
          } else {
            pendingNameRef.current = authName.trim();
            const cred = await sdk.createUserWithEmailAndPassword(auth, authEmail.trim(), authPassword);
            if (authName.trim()) await sdk.updateProfile(cred.user, { displayName: authName.trim() });
            showToast('Cuenta creada. ¡Bienvenido!');
          }
          setShowAuthModal(false);
          setAuthName(''); setAuthEmail(''); setAuthPassword('');
        } catch (err) {
          setAuthError(authErrorText(err.code));
        } finally {
          setAuthBusy(false);
        }
      };

      const handleSignOut = async () => {
        const { sdk, auth } = fb.current;
        try {
          await sdk.signOut(auth);
          setActiveTab('studio');
          showToast('Sesión cerrada.');
        } catch (e) {
          console.warn('Salir:', e);
        }
      };

      // ===== Perfil =====
      const saveProfile = async (e) => {
        e.preventDefault();
        const { sdk, auth, db } = fb.current;
        if (!user) return;
        setSavingProfile(true);
        try {
          if (auth.currentUser) await sdk.updateProfile(auth.currentUser, { displayName: profileName.trim() });
          await sdk.updateDoc(sdk.doc(db, 'users', user.uid), {
            displayName: profileName.trim(),
            preferredSize: profileSize
          });
          showToast('Perfil guardado.');
        } catch (err) {
          showToast(permissionText(err) || 'No se pudo guardar el perfil.');
        } finally {
          setSavingProfile(false);
        }
      };

      const sendPasswordReset = async () => {
        const { sdk, auth } = fb.current;
        try {
          await sdk.sendPasswordResetEmail(auth, user.email);
          showToast(`Te enviamos un enlace a ${user.email} para cambiar la contraseña.`);
        } catch (err) {
          showToast(authErrorText(err.code));
        }
      };

      const sendVerification = async () => {
        const { sdk, auth } = fb.current;
        try {
          await sdk.sendEmailVerification(auth.currentUser);
          showToast('Correo de verificación enviado. Revisa tu bandeja.');
        } catch (err) {
          showToast(authErrorText(err.code));
        }
      };

      const clearHistory = async () => {
        const { sdk, db } = fb.current;
        if (!myTryons.length) return;
        try {
          const batch = sdk.writeBatch(db);
          myTryons.slice(0, 400).forEach((t) => batch.delete(sdk.doc(db, 'tryons', t.id)));
          await batch.commit();
          showToast('Historial borrado.');
        } catch (err) {
          showToast(permissionText(err) || 'No se pudo borrar el historial.');
        }
      };

      // ===== Tiendas (admin) =====
      const openNewStore = () => { setEditingStore(null); setStoreForm(EMPTY_STORE); setShowStoreModal(true); };
      const openEditStore = (store) => {
        setEditingStore(store);
        setStoreForm({ name: store.name || '', description: store.description || '', owner: store.owner || '', phone: store.phone || '', active: store.active !== false });
        setShowStoreModal(true);
      };

      const saveStore = async (e) => {
        e.preventDefault();
        const { sdk, db } = fb.current;
        if (!storeForm.name.trim() || !db) return;
        setSavingStore(true);
        try {
          const now = new Date().toISOString();
          const data = {
            name: storeForm.name.trim(),
            description: storeForm.description.trim(),
            owner: storeForm.owner.trim(),
            phone: storeForm.phone.trim(),
            active: !!storeForm.active,
            updatedAt: now
          };
          if (editingStore) {
            await sdk.updateDoc(sdk.doc(db, 'stores', editingStore.id), data);
            // Las prendas guardan el nombre de la tienda para mostrarlo rápido
            const batch = sdk.writeBatch(db);
            catalogItems.filter(g => g.storeId === editingStore.id).forEach(g => {
              batch.set(sdk.doc(db, 'garments', g.id), { storeName: data.name }, { merge: true });
            });
            await batch.commit();
            showToast('Tienda actualizada.');
          } else {
            await sdk.addDoc(sdk.collection(db, 'stores'), { ...data, createdAt: now, createdBy: user ? user.uid : '' });
            showToast('Tienda registrada.');
          }
          setShowStoreModal(false);
          setEditingStore(null);
          setStoreForm(EMPTY_STORE);
        } catch (err) {
          showToast(permissionText(err) || 'No se pudo guardar la tienda.');
        } finally {
          setSavingStore(false);
        }
      };

      const confirmDeleteStore = async () => {
        const { sdk, db } = fb.current;
        if (!deleteStoreTarget) return;
        try {
          await sdk.deleteDoc(sdk.doc(db, 'stores', deleteStoreTarget.id));
          // Las prendas de esa tienda quedan sin tienda asignada, no se borran
          const batch = sdk.writeBatch(db);
          catalogItems.filter(g => g.storeId === deleteStoreTarget.id).forEach(g => {
            batch.set(sdk.doc(db, 'garments', g.id), { storeId: '', storeName: '' }, { merge: true });
          });
          await batch.commit();
          showToast(`Tienda "${deleteStoreTarget.name}" eliminada. Sus prendas quedaron sin tienda.`);
        } catch (err) {
          showToast(permissionText(err) || 'No se pudo eliminar la tienda.');
        } finally {
          setDeleteStoreTarget(null);
        }
      };

      const toggleStoreActive = async (store) => {
        const { sdk, db } = fb.current;
        try {
          await sdk.updateDoc(sdk.doc(db, 'stores', store.id), { active: store.active === false, updatedAt: new Date().toISOString() });
        } catch (err) {
          showToast(permissionText(err) || 'No se pudo cambiar la tienda.');
        }
      };

      const storeName = (id) => (stores.find(t => t.id === id) || {}).name || 'Sin tienda';

      // ===== Catálogo (admin) =====
      const openNewGarment = () => {
        setEditingItem(null);
        setForm({ ...EMPTY_FORM, storeId: stores.length === 1 ? stores[0].id : '' });
        setShowGarmentModal(true);
      };

      const openEditGarment = (item) => {
        if (usingFallback) {
          showToast('Primero sube el catálogo base a la base de datos (Admin → Catálogo).');
          return;
        }
        setEditingItem(item);
        setForm({
          name: item.name || '',
          category: item.category || 'top',
          storeId: item.storeId || '',
          color: item.color || '',
          price: item.price ?? '',
          sizes: item.sizes || '',
          stock: item.stock ?? '',
          active: item.active !== false,
          imageUrl: item.imageUrl || '',
          file: null,
          method: 'url'
        });
        setShowGarmentModal(true);
      };

      const askDelete = (item) => {
        if (usingFallback) {
          showToast('Primero sube el catálogo base a la base de datos (Admin → Catálogo).');
          return;
        }
        setDeleteTarget(item);
      };

      const saveGarment = async (e) => {
        e.preventDefault();
        const { sdk, db } = fb.current;
        if (!form.name.trim()) return;
        if (!db) { showToast('Firebase todavía está cargando.'); return; }
        setSavingGarment(true);
        try {
          let imageUrl = '';
          if (form.method === 'file' && form.file) imageUrl = await compressImage(form.file);
          else if (form.method === 'url' && form.imageUrl.trim()) imageUrl = form.imageUrl.trim();
          else if (editingItem) imageUrl = editingItem.imageUrl;

          if (!imageUrl) {
            showToast('Sube una imagen o pega el enlace de una.');
            setSavingGarment(false);
            return;
          }

          const now = new Date().toISOString();
          const data = {
            name: form.name.trim(),
            category: form.category,
            tag: catLabel(form.category),
            color: form.color.trim() || 'Varios',
            price: parseFloat(form.price) || 0,
            sizes: form.sizes.trim(),
            stock: parseInt(form.stock, 10) || 0,
            active: !!form.active,
            storeId: form.storeId || '',
            storeName: (stores.find(t => t.id === form.storeId) || {}).name || '',
            imageUrl,
            updatedAt: now
          };

          if (editingItem) {
            await sdk.updateDoc(sdk.doc(db, 'garments', editingItem.id), data);
            showToast('Prenda actualizada.');
          } else {
            await sdk.addDoc(sdk.collection(db, 'garments'), { ...data, createdAt: now, createdBy: user ? user.uid : '' });
            showToast('Prenda agregada al catálogo.');
          }
          setShowGarmentModal(false);
          setEditingItem(null);
          setForm(EMPTY_FORM);
        } catch (err) {
          showToast(permissionText(err) || err.message || 'No se pudo guardar la prenda.');
        } finally {
          setSavingGarment(false);
        }
      };

      const confirmDelete = async () => {
        const { sdk, db } = fb.current;
        if (!deleteTarget) return;
        try {
          await sdk.deleteDoc(sdk.doc(db, 'garments', deleteTarget.id));
          showToast(`"${deleteTarget.name}" eliminada del catálogo.`);
        } catch (err) {
          showToast(permissionText(err) || 'No se pudo eliminar la prenda.');
        } finally {
          setDeleteTarget(null);
        }
      };

      const toggleGarmentActive = async (item) => {
        const { sdk, db } = fb.current;
        if (usingFallback) {
          showToast('Primero sube el catálogo base a la base de datos.');
          return;
        }
        try {
          await sdk.updateDoc(sdk.doc(db, 'garments', item.id), { active: item.active === false, updatedAt: new Date().toISOString() });
        } catch (err) {
          showToast(permissionText(err) || 'No se pudo cambiar la visibilidad.');
        }
      };

      const seedCatalog = async () => {
        const { sdk, db } = fb.current;
        if (!db) return;
        setSeeding(true);
        try {
          let storeId = stores.length ? stores[0].id : '';
          let storeName = stores.length ? stores[0].name : '';
          if (!storeId) {
            storeId = 'tienda-demo';
            storeName = 'Tienda Demo';
            await sdk.setDoc(sdk.doc(db, 'stores', storeId), {
              name: storeName, description: 'Tienda de ejemplo creada con el catálogo base.',
              owner: user ? user.email : '', phone: '', active: true,
              createdAt: new Date().toISOString(), createdBy: user ? user.uid : ''
            });
          }
          const batch = sdk.writeBatch(db);
          DEFAULT_CATALOG.forEach((item, i) => {
            const { id, ...rest } = item;
            const stamp = `2026-01-01T00:00:${String(i).padStart(2, '0')}.000Z`;
            batch.set(sdk.doc(db, 'garments', id), {
              ...rest, sizes: 'S, M, L', stock: 10, active: true, storeId, storeName,
              createdAt: stamp, updatedAt: new Date().toISOString(), createdBy: user ? user.uid : ''
            });
          });
          await batch.commit();
          showToast('Catálogo base guardado en la base de datos.');
        } catch (err) {
          showToast(permissionText(err) || 'No se pudo subir el catálogo base.');
        } finally {
          setSeeding(false);
        }
      };

      // ===== Usuarios y ajustes (admin) =====
      const changeRole = async (target, role) => {
        const { sdk, db } = fb.current;
        try {
          await sdk.updateDoc(sdk.doc(db, 'users', target.id), { role });
          showToast(`${target.email} ahora es ${role === 'admin' ? 'administrador' : 'usuario'}.`);
        } catch (err) {
          showToast(permissionText(err) || 'No se pudo cambiar el rol.');
        }
      };

      const saveSettings = async (e) => {
        e.preventDefault();
        const { sdk, db } = fb.current;
        setSavingSettings(true);
        try {
          await sdk.setDoc(sdk.doc(db, 'settings', 'app'), {
            ...settingsDraft,
            storeName: (settingsDraft.storeName || '').trim() || DEFAULT_SETTINGS.storeName,
            tagline: (settingsDraft.tagline || '').trim(),
            updatedAt: new Date().toISOString(),
            updatedBy: user ? user.email : ''
          }, { merge: true });
          showToast('Ajustes guardados.');
        } catch (err) {
          showToast(permissionText(err) || 'No se pudieron guardar los ajustes.');
        } finally {
          setSavingSettings(false);
        }
      };

      // ===== Probador =====
      // Conjunto: una prenda por zona del cuerpo (camisa, pantalón, gorra, zapatos o vestido)
      const withoutConflicts = (list, category) => {
        let next = list.filter(l => l.category !== category);
        if (category === 'full') next = next.filter(l => l.category !== 'top' && l.category !== 'bottom');
        if (category === 'top' || category === 'bottom') next = next.filter(l => l.category !== 'full');
        return next;
      };

      const addToOutfit = (layer) => {
        const uid = ++layerUid.current;
        setOutfit(prev => [...withoutConflicts(prev, layer.category), { ...layer, uid }]);
      };

      const removeFromOutfit = (uid) => setOutfit(prev => prev.filter(l => l.uid !== uid));

      const changeLayerCategory = (uid, category) => {
        setOutfit(prev => {
          const layer = prev.find(l => l.uid === uid);
          if (!layer) return prev;
          const rest = withoutConflicts(prev.filter(l => l.uid !== uid), category);
          const name = layer.name.startsWith('Mi prenda (') ? `Mi prenda (${catLabel(category)})` : layer.name;
          return [...rest, { ...layer, category, name }];
        });
      };

      const selectCatalogGarment = (item) => {
        addToOutfit({ src: item.imageUrl, name: item.name, category: item.category, garmentId: item.id, price: item.price, storeId: item.storeId || '' });
        setActiveTab('studio');
        showToast(`"${item.name}" agregada a tu conjunto.`);
      };

      const loadMannequin = async (dark) => {
        try {
          const m = await buildMannequin(dark);
          setModelImage(m.url);
          showToast('Maniquí de prueba cargado. Agrega prendas y toca "Probar".');
        } catch (e) {
          showToast('No se pudo cargar el maniquí de prueba.');
        }
      };

      const handleClothDrop = (file) => {
        addToOutfit({ src: file, name: `Mi prenda (${catLabel(uploadCategory)})`, category: uploadCategory, garmentId: null, price: 0 });
      };

      const getPose = async (modelKey, source) => {
        if (poseRef.current.key === modelKey) return poseRef.current.pose;
        // El maniquí de prueba ya trae sus puntos y su silueta exactos
        if (mannequinCache && modelKey === mannequinCache.url) return mannequinCache.pose;
        if (!window.PoseAPI) return null;
        try {
          const pose = await window.PoseAPI.detect(source);
          poseRef.current = { key: modelKey, pose };
          return pose;
        } catch (e) {
          console.warn('Detector de cuerpo:', e);
          return null;
        }
      };

      const getGarmentCanvas = (layer, img, bg) => {
        const key = `${layer.uid}|${bg}`;
        const cache = garmentCacheRef.current;
        if (!cache.has(key)) {
          if (cache.size > 30) cache.clear();
          cache.set(key, prepareGarment(img, bg));
        }
        return cache.get(key);
      };

      const composeLook = async () => {
        const modelImg = await loadImage(srcOf(modelImage));
        const s = Math.min(1, 1400 / Math.max(modelImg.naturalWidth, modelImg.naturalHeight));
        const W = Math.round(modelImg.naturalWidth * s);
        const H = Math.round(modelImg.naturalHeight * s);

        const base = document.createElement('canvas');
        base.width = W; base.height = H;
        base.getContext('2d').drawImage(modelImg, 0, 0, W, H);

        const pose = (autoFit || showSilhouette) ? await getPose(modelImage, base) : null;
        const lm = pose ? pose.landmarks : null;
        const mask = pose ? pose.mask : null;

        const canvas = document.createElement('canvas');
        canvas.width = W; canvas.height = H;
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        ctx.drawImage(base, 0, 0);

        // Datos del cuerpo de la foto (contorno y luz). Se calculan una sola vez por foto.
        let body = null;
        if (autoFit && mask) {
          if (bodyRef.current.key !== modelImage) {
            const sW = lm ? Math.hypot((lm[11].x - lm[12].x) * W, (lm[11].y - lm[12].y) * H) : 0;
            bodyRef.current = { key: modelImage, body: buildBodyData(base, mask, W, H, sW) };
          }
          body = bodyRef.current.body;
        }

        const layers = [...outfit].sort((a, b) => LAYER_ORDER.indexOf(a.category) - LAYER_ORDER.indexOf(b.category));
        let fitted = 0;
        let coversBody = false;

        for (const layer of layers) {
          if (layer.category === 'head' && coversBody && autoFit) {
            restoreBodyParts(ctx, base, lm, mask, W, H);
            coversBody = false;
          }
          let img;
          try {
            img = await loadImage(srcOf(layer.src));
          } catch (e) {
            throw new Error(`No se pudo cargar "${layer.name}". Si es un enlace, sube la imagen como archivo.`);
          }
          const g = getGarmentCanvas(layer, img, removeBg);
          const aspect = g.height / g.width;
          // Posición y tamaño salen de los puntos del cuerpo; la prenda se escala parejo (no se deforma el diseño).
          // Con silueta, el pantalón puede alargarse hasta los tobillos de la persona
          let place = autoFit ? bodyPlacement(layer.category, W, H, aspect, lm, !!body && layer.category === 'bottom') : null;
          const bodyOk = !!place;
          if (!place) place = standardPlacement(layer.category, W, H, aspect);
          if (bodyOk && (layer.category === 'top' || layer.category === 'full')) place = sizeTopToTorso(place, g, lm, W, H, layer.category);

          // La prenda se arma en su propia capa y después se adapta al cuerpo de la foto:
          // 1) se deforma con una malla que sigue las curvas del cuerpo,
          // 2) se le da volumen, 3) se recorta a la silueta, 4) toma la luz de la foto
          const layerCanvas = document.createElement('canvas');
          layerCanvas.width = W; layerCanvas.height = H;
          const lctx2 = layerCanvas.getContext('2d', { willReadFrequently: true });
          const esTela = ['top', 'bottom', 'full'].includes(layer.category);
          // Zapatos: uno en cada pie, del tamaño del pie; el resto, colocado con los puntos del cuerpo
          const shoesDrawn = layer.category === 'shoes' && autoFit && drawShoes(lctx2, g, lm, mask, W, H);
          let conMalla = false;
          if (!shoesDrawn) {
            if (body && bodyOk && esTela) {
              conMalla = warpGarmentToBody(lctx2, g, place, layer.category, lm, mask, W, H);
            }
            if (!conMalla) drawRigid(lctx2, g, place);
          }
          if (body && bodyOk) {
            // Si la malla no se pudo aplicar (pocos puntos visibles), se usa el ajuste por filas
            if (!conMalla && esTela) conformLayerToBody(layerCanvas, layer.category, mask, lm, W, H);
            if (conMalla && (layer.category === 'top' || layer.category === 'full')) {
              shadeGarmentVolume(layerCanvas, layer.category, lm, mask, W, H, 0.28);
            }
            if (layer.category === 'top' || layer.category === 'full') fillTopGaps(layerCanvas, mask, lm, W, H);
            fitLayerToBody(layerCanvas, body, W, H, layer.category === 'top' || layer.category === 'bottom');
          }

          ctx.save();
          // Con el cuerpo detectado la prenda va opaca para que no se transparente la ropa de la foto
          ctx.globalAlpha = body ? 1 : 0.95;
          ctx.shadowColor = 'rgba(0, 0, 0, 0.35)';
          ctx.shadowBlur = body ? 10 : 18;
          ctx.shadowOffsetY = body ? 3 : 6;
          ctx.drawImage(layerCanvas, 0, 0);
          ctx.restore();
          if (bodyOk) fitted++;
          if (layer.category === 'top' || layer.category === 'full') coversBody = true;
        }
        if (coversBody && autoFit) restoreBodyParts(ctx, base, lm, mask, W, H);
        if (showSilhouette) drawSilhouette(ctx, mask, W, H);

        let status = 'off';
        if (autoFit) status = fitted === layers.length ? 'ok' : fitted > 0 ? 'partial' : 'fallback';
        return { url: canvas.toDataURL('image/jpeg', 0.92), status };
      };

      useEffect(() => { hasResultRef.current = !!resultImage; }, [resultImage]);

      // Vuelve a encajar en vivo al mover los controles o cambiar la prenda
      useEffect(() => {
        if (!modelImage || !hasResultRef.current || lastMethod === 'ia' || isGenerating) return;
        if (outfit.length === 0) { setResultImage(null); return; }
        const token = ++renderTokenRef.current;
        composeLook()
          .then((r) => {
            if (token !== renderTokenRef.current) return;
            setResultImage(r.url);
            setFitStatus(r.status);
            setErrorMessage(null);
          })
          .catch((err) => { if (token === renderTokenRef.current) setErrorMessage(err.message); });
      }, [autoFit, removeBg, showSilhouette, modelImage, outfit]);

      const recordTryon = async (method) => {
        const { sdk, db } = fb.current;
        if (!user || !db) return;
        try {
          await sdk.addDoc(sdk.collection(db, 'tryons'), {
            userId: user.uid,
            email: user.email || '',
            garmentId: outfit.length === 1 ? outfit[0].garmentId : null,
            garmentIds: outfit.map(l => l.garmentId).filter(Boolean),
            storeIds: [...new Set(outfit.map(l => l.storeId).filter(Boolean))],
            garmentName: outfit.map(l => l.name).join(' + '),
            category: outfit.length === 1 ? outfit[0].category : 'outfit',
            method,
            createdAt: new Date().toISOString()
          });
        } catch (e) {
          console.warn('Historial:', e);
        }
      };

      const handleGenerate = async () => {
        if (!modelImage || outfit.length === 0) return;

        setIsGenerating(true);
        setProgress(12);
        setProgressStatus(autoFit ? "Detectando tu cuerpo..." : "Procesando fotos cargadas...");
        setErrorMessage(null);

        const progressInterval = setInterval(() => {
          setProgress((prev) => {
            if (prev >= 90) return 90;
            if (prev > 60) setProgressStatus("Ajustando sombras y perspectiva...");
            else if (prev > 30) setProgressStatus(autoFit ? "Encajando la prenda a tu cuerpo..." : "Integrando textura y contornos...");
            return prev + Math.floor(Math.random() * 8) + 2;
          });
        }, 350);

        const runLocal = async () => {
          const r = await composeLook();
          setProgress(100);
          setResultImage(r.url);
          setFitStatus(r.status);
          setLastMethod('local');
          recordTryon(autoFit ? (r.status === 'ok' ? 'auto' : 'manual') : 'manual');
        };

        try {
          const activeApiKey = settings.aiEnabled ? apiKeyInput.trim() : '';

          if (activeApiKey) {
            const toDataUrl = async (fileOrUrl) => {
              let blob = fileOrUrl;
              if (typeof fileOrUrl === 'string') {
                if (fileOrUrl.startsWith('data:')) return fileOrUrl;
                blob = await (await fetch(fileOrUrl)).blob();
              }
              return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = reject;
                reader.readAsDataURL(blob);
              });
            };
            const toPart = (dataUrl) => ({
              inlineData: { mimeType: dataUrl.split(';')[0].split(':')[1] || 'image/png', data: dataUrl.split(',')[1] }
            });

            const modelPart = toPart(await toDataUrl(modelImage));
            const garmentParts = [];
            for (const layer of outfit) garmentParts.push(toPart(await toDataUrl(layer.src)));
            const list = outfit.map((l, i) => `image ${i + 2}: ${l.category}`).join(', ');

            const payload = {
              contents: [
                {
                  role: "user",
                  parts: [
                    { text: `Photorealistic virtual try-on. Dress the person in image 1 with every garment provided (${list}). Each garment must follow the person's body silhouette, shoulders, waist and pose. Keep face, hands, posture and background unchanged.` },
                    modelPart,
                    ...garmentParts
                  ]
                }
              ],
              generationConfig: { responseModalities: ["IMAGE"] }
            };

            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-flash-image:generateContent?key=${activeApiKey}`;
            const response = await fetch(apiUrl, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            });

            if (!response.ok) throw new Error("Respuesta fallida de la API");

            const result = await response.json();
            const candidatePart = result?.candidates?.[0]?.content?.parts?.find(p => p.inlineData);

            if (candidatePart?.inlineData?.data) {
              setProgress(100);
              setResultImage(`data:${candidatePart.inlineData.mimeType || 'image/png'};base64,${candidatePart.inlineData.data}`);
              setFitStatus('ia');
              setLastMethod('ia');
              recordTryon('ia');
            } else {
              throw new Error("No se devolvió imagen válida.");
            }
          } else {
            await runLocal();
          }
        } catch (err) {
          try {
            await runLocal();
          } catch (fallbackErr) {
            setErrorMessage(fallbackErr.message || "Ocurrió un error al procesar las prendas.");
          }
        } finally {
          clearInterval(progressInterval);
          setIsGenerating(false);
        }
      };

      const activeStoreIds = stores.filter(t => t.active !== false).map(t => t.id);
      const visibleCatalog = isAdmin
        ? catalogItems
        : catalogItems.filter(item => item.active !== false && (!item.storeId || activeStoreIds.includes(item.storeId)));
      const filteredCatalog = visibleCatalog.filter(item => {
        const q = searchQuery.toLowerCase();
        const matchesCategory = selectedCategory === 'all' || item.category === selectedCategory;
        const matchesStore = storeFilter === 'all' || (item.storeId || '') === storeFilter;
        const matchesSearch = (item.name || '').toLowerCase().includes(q) || (item.color || '').toLowerCase().includes(q);
        return matchesCategory && matchesStore && matchesSearch;
      });

      const adminCatalog = catalogItems.filter(item => {
        const q = adminSearch.toLowerCase();
        return (item.name || '').toLowerCase().includes(q) || (item.color || '').toLowerCase().includes(q)
          || catLabel(item.category).toLowerCase().includes(q) || storeName(item.storeId).toLowerCase().includes(q);
      });

      // ===== Reporte de productos más probados =====
      const report = (() => {
        const byGarment = {}, byStore = {}, byCategory = {};
        allTryons.forEach((t) => {
          const ids = (t.garmentIds && t.garmentIds.length) ? t.garmentIds : (t.garmentId ? [t.garmentId] : []);
          ids.forEach((id) => { byGarment[id] = (byGarment[id] || 0) + 1; });
          (t.storeIds || []).forEach((sid) => { byStore[sid] = (byStore[sid] || 0) + 1; });
          if (t.category) byCategory[t.category] = (byCategory[t.category] || 0) + 1;
        });
        const garments = Object.entries(byGarment).map(([id, count]) => {
          const g = catalogItems.find(x => x.id === id) || {};
          return { id, count, name: g.name || 'Prenda eliminada', category: g.category, storeId: g.storeId, price: g.price || 0 };
        }).sort((a, b) => b.count - a.count);
        const storesTop = Object.entries(byStore).map(([id, count]) => ({ id, count, name: storeName(id) })).sort((a, b) => b.count - a.count);
        const categories = Object.entries(byCategory).map(([id, count]) => ({ id, count, label: catLabel(id) })).sort((a, b) => b.count - a.count);
        const users = new Set(allTryons.map(t => t.userId)).size;
        return { garments, storesTop, categories, total: allTryons.length, users };
      })();

      const tabs = [
        { id: 'studio', label: 'Probador Virtual' },
        { id: 'catalog', label: 'Catálogo' },
        ...(user ? [{ id: 'profile', label: 'Mi perfil' }] : []),
        ...(isAdmin ? [{ id: 'admin', label: 'Admin' }] : []),
      ];

      const fitMessage = {
        ok: { text: 'Ajustada a tu cuerpo', cls: 'bg-emerald-500/15 text-emerald-400 border-emerald-500/30' },
        fallback: { text: 'No se detectó el cuerpo: se usó la posición estándar. Prueba con una foto de frente y de cuerpo completo.', cls: 'bg-amber-500/15 text-amber-400 border-amber-500/30' },
        off: { text: 'Posición estándar', cls: 'bg-gray-500/15 text-gray-400 border-gray-500/30' },
        partial: { text: 'Algunas prendas no encontraron su zona del cuerpo: usa una foto de cuerpo completo.', cls: 'bg-amber-500/15 text-amber-400 border-amber-500/30' },
        ia: { text: 'Generada con IA', cls: 'bg-purple-500/15 text-purple-300 border-purple-500/30' },
      }[fitStatus];

      const panelCls = isDark ? 'glass-panel shadow-2xl' : 'bg-white shadow-xl border border-gray-100';
      const subtle = isDark ? 'text-gray-400' : 'text-gray-600';
      const initial = ((profile?.displayName || user?.email || '?').trim()[0] || '?').toUpperCase();


      return (
        <div className={`min-h-screen transition-colors duration-500 ${isDark ? 'bg-[#0a0a0a] text-white' : 'bg-gray-50 text-gray-900'} relative flex flex-col`}>
          <div className="absolute top-[-10%] left-[-10%] w-[45%] h-[45%] rounded-full bg-indigo-600/10 blur-[120px] pointer-events-none"></div>
          <div className="absolute bottom-[-10%] right-[-10%] w-[45%] h-[45%] rounded-full bg-purple-600/10 blur-[120px] pointer-events-none"></div>

          {toastMessage && (
            <div role="status" className="fixed bottom-5 right-5 z-[60] max-w-sm bg-indigo-600 text-white px-4 py-2.5 rounded-2xl shadow-2xl text-xs font-semibold flex items-center gap-2">
              <SparklesIcon className="w-4 h-4 text-yellow-300 shrink-0" />
              {toastMessage}
            </div>
          )}

          <header className={`w-full p-4 md:p-6 flex flex-wrap gap-3 justify-between items-center z-30 border-b ${isDark ? 'border-white/5 bg-[#0a0a0a]/80' : 'border-black/5 bg-gray-50/80'} backdrop-blur-md sticky top-0`}>
            <div className="flex items-center gap-3">
              <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center shadow-lg shadow-indigo-500/30">
                <SparklesIcon className="text-white w-5 h-5" />
              </div>
              <div>
                <h1 className="text-xl md:text-2xl font-bold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-indigo-400 to-purple-500">
                  {settings.storeName}
                </h1>
                {settings.tagline && <p className="text-[10px] text-gray-400 hidden sm:block">{settings.tagline}</p>}
              </div>
            </div>

            <nav className={`order-last lg:order-none w-full lg:w-auto flex items-center p-1 rounded-2xl overflow-x-auto scrollbar-none ${isDark ? 'bg-white/5 border border-white/10' : 'bg-black/5 border border-black/5'}`}>
              {tabs.map((t) => (
                <button
                  key={t.id}
                  onClick={() => setActiveTab(t.id)}
                  className={`flex-1 lg:flex-none whitespace-nowrap px-4 py-1.5 rounded-xl text-xs font-semibold transition-all ${
                    activeTab === t.id
                      ? 'bg-indigo-600 text-white shadow-md'
                      : (isDark ? 'text-gray-400 hover:text-white' : 'text-gray-500 hover:text-gray-900')
                  }`}
                >
                  {t.label}
                </button>
              ))}
            </nav>

            <div className="flex items-center gap-2">
              {isAdmin && (
                <button
                  onClick={openNewGarment}
                  className="flex items-center gap-1.5 bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white text-xs font-semibold px-3 py-2 rounded-xl shadow-lg transition-all"
                >
                  <PlusIcon className="w-4 h-4" />
                  <span className="hidden md:inline">Agregar prenda</span>
                </button>
              )}

              {settings.aiEnabled && (
                <button
                  onClick={() => setShowKeyModal(true)}
                  className={`p-2.5 rounded-xl text-xs font-semibold transition-all ${
                    apiKeyInput.trim()
                      ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30'
                      : (isDark ? 'bg-white/10 hover:bg-white/20 text-gray-300' : 'bg-black/5 hover:bg-black/10 text-gray-700')
                  }`}
                  title="Configurar Gemini API Key"
                  aria-label="Configurar Gemini API Key"
                >
                  <KeyIcon className="w-4 h-4" />
                </button>
              )}

              {user ? (
                <div className="flex items-center gap-2">
                  <button
                    onClick={() => setActiveTab('profile')}
                    className={`flex items-center gap-2 pl-1 pr-3 py-1 rounded-xl border transition-all ${isDark ? 'border-white/10 hover:bg-white/10' : 'border-black/10 hover:bg-black/5'}`}
                    title="Mi perfil"
                  >
                    <span className="w-7 h-7 rounded-lg bg-gradient-to-br from-indigo-500 to-purple-600 text-white text-xs font-bold flex items-center justify-center">{initial}</span>
                    <span className="text-xs font-medium hidden lg:inline max-w-[140px] truncate">{profile?.displayName || user.email}</span>
                    {isAdmin && <span className="text-[10px] font-bold text-amber-400 hidden sm:inline">Admin</span>}
                  </button>
                  <button
                    onClick={handleSignOut}
                    className="text-xs px-3 py-2 rounded-xl bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/20 font-semibold transition-all"
                  >
                    Salir
                  </button>
                </div>
              ) : (
                <button
                  onClick={() => { setAuthMode('login'); setAuthError(null); setShowAuthModal(true); }}
                  className="flex items-center gap-1.5 bg-indigo-600/20 hover:bg-indigo-600/30 text-indigo-400 border border-indigo-500/30 text-xs font-semibold px-3 py-2 rounded-xl transition-all"
                >
                  <UserIcon className="w-4 h-4" />
                  <span>Ingresar</span>
                </button>
              )}

              <button
                onClick={() => setIsDark(!isDark)}
                className={`p-2.5 rounded-xl ${isDark ? 'bg-white/10 hover:bg-white/20' : 'bg-black/5 hover:bg-black/10'} transition-all`}
                aria-label="Cambiar tema"
              >
                {isDark ? <SunIcon className="w-4 h-4" /> : <MoonIcon className="w-4 h-4" />}
              </button>
            </div>
          </header>

          {/* ===== Modal de sesión ===== */}
          {showAuthModal && (
            <div className="fixed inset-0 z-50 bg-black/70 backdrop-blur-md flex items-center justify-center p-4">
              <div className={`w-full max-w-sm p-6 rounded-3xl shadow-2xl ${isDark ? 'bg-gray-900 border border-gray-800 text-white' : 'bg-white text-gray-900'}`}>
                <div className="flex justify-between items-center mb-4">
                  <h3 className="text-lg font-bold flex items-center gap-2">
                    <UserIcon className="w-5 h-5 text-indigo-400" />
                    {authMode === 'login' ? 'Iniciar sesión' : 'Crear cuenta'}
                  </h3>
                  <button onClick={() => setShowAuthModal(false)} className="text-gray-400 hover:text-white" aria-label="Cerrar">✕</button>
                </div>

                {authError && (
                  <div className="p-3 mb-4 rounded-xl bg-red-500/10 border border-red-500/20 text-red-400 text-xs">{authError}</div>
                )}

                {authMode === 'signup' && !settings.allowSignup ? (
                  <p className={`text-xs ${subtle}`}>Los registros nuevos están cerrados por ahora. Si ya tienes cuenta, inicia sesión.</p>
                ) : (

                      <div className={`flex items-center rounded-xl border p-2 ${isDark ? 'bg-gray-900 border-gray-800' : 'bg-white border-gray-300'}`}>
                        <SearchIcon className="w-4 h-4 text-gray-400 mr-2" />
                        <input type="text" placeholder="Buscar prenda, color o categoría..." value={adminSearch} onChange={(e) => setAdminSearch(e.target.value)} className="bg-transparent text-xs focus:outline-none w-full sm:w-64" />
                      </div>
                      <button onClick={openNewGarment} className="flex items-center justify-center gap-2 bg-gradient-to-r from-purple-600 to-indigo-600 text-white px-4 py-2 rounded-xl text-xs font-bold shadow-lg">
                        <PlusIcon className="w-4 h-4" /> Agregar prenda
                      </button>
                    </div>

                    <div className="overflow-x-auto">
                      <table className="w-full text-xs min-w-[720px]">
                        <thead>
                          <tr className="text-left text-gray-400 border-b border-gray-500/20">
                            <th className="py-2 pr-3 font-semibold">Prenda</th>
                            <th className="py-2 pr-3 font-semibold">Categoría</th>
                            <th className="py-2 pr-3 font-semibold">Tienda</th>
                            <th className="py-2 pr-3 font-semibold">Precio</th>
                            <th className="py-2 pr-3 font-semibold">Tallas</th>
                            <th className="py-2 pr-3 font-semibold">Existencias</th>
                            <th className="py-2 pr-3 font-semibold">Visible</th>
                            <th className="py-2 font-semibold text-right">Acciones</th>
                          </tr>
                        </thead>
                        <tbody>
                          {adminCatalog.map(item => (
                            <tr key={item.id} className="border-b border-gray-500/10">
                              <td className="py-2 pr-3">
                                <div className="flex items-center gap-3">
                                  <div className={`w-11 h-11 rounded-lg flex items-center justify-center p-1 shrink-0 ${isDark ? 'bg-gray-800' : 'bg-gray-100'}`}>
                                    <img src={item.imageUrl} alt="" className="max-h-full max-w-full object-contain" />
                                  </div>
                                  <div className="min-w-0">
                                    <p className="font-semibold truncate max-w-[200px]">{item.name}</p>
                                    <p className="text-[11px] text-gray-400">{item.color}</p>
                                  </div>
                                </div>
                              </td>
                              <td className="py-2 pr-3">{catLabel(item.category)}</td>
                              <td className="py-2 pr-3">{storeName(item.storeId)}</td>
                              <td className="py-2 pr-3">{money(item.price)}</td>
                              <td className="py-2 pr-3">{item.sizes || '—'}</td>
                              <td className={`py-2 pr-3 ${Number(item.stock) === 0 ? 'text-red-400 font-semibold' : ''}`}>{item.stock ?? '—'}</td>
                              <td className="py-2 pr-3">
                                <button role="switch" aria-checked={item.active !== false} onClick={() => toggleGarmentActive(item)} aria-label={`Visibilidad de ${item.name}`}
                                  className={`relative w-10 h-6 rounded-full transition-colors ${item.active !== false ? 'bg-emerald-600' : (isDark ? 'bg-gray-700' : 'bg-gray-300')}`}>
                                  <span className={`absolute top-1 left-1 w-4 h-4 rounded-full bg-white shadow transition-transform ${item.active !== false ? 'translate-x-4' : ''}`}></span>
                                </button>
                              </td>
                              <td className="py-2 text-right whitespace-nowrap">
                                <button onClick={() => openEditGarment(item)} className={`inline-flex items-center gap-1 px-3 py-1.5 rounded-lg mr-1 ${isDark ? 'bg-white/5 hover:bg-white/10' : 'bg-black/5 hover:bg-black/10'}`}>
                                  <PencilIcon className="w-3.5 h-3.5" /> Editar
                                </button>
                                <button onClick={() => askDelete(item)} className="inline-flex items-center gap-1 px-3 py-1.5 rounded-lg bg-red-500/10 hover:bg-red-500/20 text-red-400">
                                  <TrashIcon className="w-3.5 h-3.5" /> Eliminar
                                </button>
                              </td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                      {adminCatalog.length === 0 && <p className="text-center text-xs text-gray-400 py-8">No hay prendas que coincidan.</p>}
                    </div>
                  </div>
                )}

                {adminSection === 'stores' && (
                  <div className={`p-4 md:p-6 rounded-3xl ${panelCls} flex flex-col gap-4`}>
                    <div className="flex flex-col sm:flex-row justify-between gap-3">
                      <p className={`text-xs ${subtle}`}>Cada tienda local tiene su propio catálogo. Los clientes pueden filtrar por tienda en el catálogo público.</p>
                      <button onClick={openNewStore} className="shrink-0 flex items-center justify-center gap-2 bg-gradient-to-r from-purple-600 to-indigo-600 text-white px-4 py-2 rounded-xl text-xs font-bold shadow-lg">
                        <PlusIcon className="w-4 h-4" /> Registrar tienda
                      </button>
                    </div>
                    <div className="overflow-x-auto">
                      <table className="w-full text-xs min-w-[720px]">
                        <thead>
                          <tr className="text-left text-gray-400 border-b border-gray-500/20">
                            <th className="py-2 pr-3 font-semibold">Tienda</th>
                            <th className="py-2 pr-3 font-semibold">Encargado</th>
                            <th className="py-2 pr-3 font-semibold">Teléfono</th>
                            <th className="py-2 pr-3 font-semibold">Prendas</th>
                            <th className="py-2 pr-3 font-semibold">Pruebas</th>
                            <th className="py-2 pr-3 font-semibold">Visible</th>
                            <th className="py-2 font-semibold text-right">Acciones</th>
                          </tr>
                        </thead>
                        <tbody>
                          {stores.map(t => (
                            <tr key={t.id} className="border-b border-gray-500/10">
                              <td className="py-2 pr-3">
                                <p className="font-semibold">{t.name}</p>
                                <p className="text-[11px] text-gray-400">{t.description || '—'}</p>
                              </td>
                              <td className="py-2 pr-3 break-all">{t.owner || '—'}</td>
                              <td className="py-2 pr-3">{t.phone || '—'}</td>
                              <td className="py-2 pr-3">{catalogItems.filter(g => g.storeId === t.id).length}</td>
                              <td className="py-2 pr-3">{(report.storesTop.find(s2 => s2.id === t.id) || {}).count || 0}</td>
                              <td className="py-2 pr-3">
                                <button role="switch" aria-checked={t.active !== false} onClick={() => toggleStoreActive(t)} aria-label={`Visibilidad de ${t.name}`}
                                  className={`relative w-10 h-6 rounded-full transition-colors ${t.active !== false ? 'bg-emerald-600' : (isDark ? 'bg-gray-700' : 'bg-gray-300')}`}>
                                  <span className={`absolute top-1 left-1 w-4 h-4 rounded-full bg-white shadow transition-transform ${t.active !== false ? 'translate-x-4' : ''}`}></span>
                                </button>
                              </td>
                              <td className="py-2 text-right whitespace-nowrap">
                                <button onClick={() => openEditStore(t)} className={`inline-flex items-center gap-1 px-3 py-1.5 rounded-lg mr-1 ${isDark ? 'bg-white/5 hover:bg-white/10' : 'bg-black/5 hover:bg-black/10'}`}>
                                  <PencilIcon className="w-3.5 h-3.5" /> Editar
                                </button>
                                <button onClick={() => setDeleteStoreTarget(t)} className="inline-flex items-center gap-1 px-3 py-1.5 rounded-lg bg-red-500/10 hover:bg-red-500/20 text-red-400">
                                  <TrashIcon className="w-3.5 h-3.5" /> Eliminar
                                </button>
                              </td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                      {stores.length === 0 && (
                        <div className="text-center py-8">
                          <p className="text-xs text-gray-400">Todavía no hay tiendas registradas.</p>
                          <button onClick={openNewStore} className="mt-3 text-xs text-indigo-400 underline font-semibold">Registrar la primera tienda</button>
                        </div>
                      )}
                    </div>
                  </div>
                )}

                {adminSection === 'report' && (
                  <div className="flex flex-col gap-4">
                    <div className={`p-4 md:p-6 rounded-3xl ${panelCls}`}>
                      <h3 className="font-bold mb-1 flex items-center gap-2"><ChartIcon className="w-4 h-4 text-indigo-400" /> Productos más probados</h3>
                      <p className={`text-xs mb-4 ${subtle}`}>{report.total} pruebas registradas de {report.users} usuario(s). Cada vez que alguien se prueba una prenda, se suma aquí.</p>
                      <div className="overflow-x-auto">
                        <table className="w-full text-xs min-w-[640px]">
                          <thead>
                            <tr className="text-left text-gray-400 border-b border-gray-500/20">
                              <th className="py-2 pr-3 font-semibold">#</th>
                              <th className="py-2 pr-3 font-semibold">Prenda</th>
                              <th className="py-2 pr-3 font-semibold">Categoría</th>
                              <th className="py-2 pr-3 font-semibold">Tienda</th>
                              <th className="py-2 pr-3 font-semibold">Veces probada</th>
                              <th className="py-2 font-semibold">Participación</th>
                            </tr>
                          </thead>
                          <tbody>
                            {report.garments.slice(0, 15).map((g, i) => (
                              <tr key={g.id} className="border-b border-gray-500/10">
                                <td className="py-2 pr-3 font-bold text-indigo-400">{i + 1}</td>
                                <td className="py-2 pr-3 font-semibold">{g.name}</td>
                                <td className="py-2 pr-3">{catLabel(g.category)}</td>
                                <td className="py-2 pr-3">{storeName(g.storeId)}</td>
                                <td className="py-2 pr-3 font-bold">{g.count}</td>
                                <td className="py-2 w-40">
                                  <div className={`h-2 rounded-full ${isDark ? 'bg-white/10' : 'bg-black/10'}`}>
                                    <div className="h-2 rounded-full bg-gradient-to-r from-indigo-500 to-purple-500" style={{ width: `${Math.round((g.count / (report.garments[0] ? report.garments[0].count : 1)) * 100)}%` }}></div>
                                  </div>
                                </td>
                              </tr>
                            ))}
                          </tbody>
                        </table>
                        {report.garments.length === 0 && <p className="text-center text-xs text-gray-400 py-8">Todavía no hay pruebas registradas.</p>}
                      </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                      <div className={`p-4 md:p-6 rounded-3xl ${panelCls}`}>
                        <h3 className="font-bold mb-3">Pruebas por tienda</h3>
                        {report.storesTop.length === 0 ? <p className={`text-xs ${subtle}`}>Sin datos todavía.</p> : (
                          <ul className="flex flex-col divide-y divide-gray-500/15 text-xs">
                            {report.storesTop.map(t => (
                              <li key={t.id} className="py-2 flex justify-between"><span className="font-semibold">{t.name}</span><span className="text-indigo-400 font-bold">{t.count}</span></li>
                            ))}
                          </ul>
                        )}
                      </div>
                      <div className={`p-4 md:p-6 rounded-3xl ${panelCls}`}>
                        <h3 className="font-bold mb-3">Pruebas por categoría</h3>
                        {report.categories.length === 0 ? <p className={`text-xs ${subtle}`}>Sin datos todavía.</p> : (
                          <ul className="flex flex-col divide-y divide-gray-500/15 text-xs">
                            {report.categories.map(c => (
                              <li key={c.id} className="py-2 flex justify-between"><span className="font-semibold">{c.label}</span><span className="text-indigo-400 font-bold">{c.count}</span></li>
                            ))}
                          </ul>
                        )}
                      </div>
                    </div>
                  </div>
                )}

                {adminSection === 'users' && (
                  <div className={`p-4 md:p-6 rounded-3xl ${panelCls}`}>
                    <p className={`text-xs mb-4 ${subtle}`}>Cambia el rol para dar o quitar acceso al panel de administración.</p>
                    <div className="overflow-x-auto">
                      <table className="w-full text-xs min-w-[640px]">
                        <thead>
                          <tr className="text-left text-gray-400 border-b border-gray-500/20">
                            <th className="py-2 pr-3 font-semibold">Correo</th>
                            <th className="py-2 pr-3 font-semibold">Nombre</th>
                            <th className="py-2 pr-3 font-semibold">Rol</th>
                            <th className="py-2 pr-3 font-semibold">Registrado</th>
                            <th className="py-2 font-semibold">Último ingreso</th>
                          </tr>
                        </thead>
                        <tbody>
                          {usersList.map(u => (
                            <tr key={u.id} className="border-b border-gray-500/10">
                              <td className="py-2 pr-3 font-semibold break-all">{u.email}{u.id === user.uid && <span className="text-[10px] text-indigo-400 ml-1">(tú)</span>}</td>
                              <td className="py-2 pr-3">{u.displayName || '—'}</td>
                              <td className="py-2 pr-3">
                                <select value={u.role || 'user'} disabled={u.id === user.uid || isAdminEmail(u.email)} onChange={(e) => changeRole(u, e.target.value)}
                                  className={`p-1.5 rounded-lg border text-xs disabled:opacity-60 ${isDark ? 'bg-gray-800 border-gray-700' : 'bg-gray-100 border-gray-300'}`}>
                                  <option value="user">Usuario</option>
                                  <option value="admin">Administrador</option>
                                </select>
                              </td>
                              <td className="py-2 pr-3">{formatDate(u.createdAt)}</td>
                              <td className="py-2">{formatDate(u.lastLogin)}</td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                      {usersList.length === 0 && <p className="text-center text-xs text-gray-400 py-8">Aún no hay usuarios registrados.</p>}
                    </div>
                  </div>
                )}

                {adminSection === 'settings' && (
                  <form onSubmit={saveSettings} className={`p-4 md:p-6 rounded-3xl ${panelCls} flex flex-col gap-5`}>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                      <div>
                        <label className="text-[11px] font-semibold text-gray-400 uppercase">Nombre de la tienda</label>
                        <input type="text" value={settingsDraft.storeName} onChange={(e) => setSettingsDraft({ ...settingsDraft, storeName: e.target.value })} className={inputCls(isDark)} />
                      </div>
                      <div>
                        <label className="text-[11px] font-semibold text-gray-400 uppercase">Eslogan</label>
                        <input type="text" value={settingsDraft.tagline} onChange={(e) => setSettingsDraft({ ...settingsDraft, tagline: e.target.value })} className={inputCls(isDark)} />
                      </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-2">
                      <Toggle isDark={isDark} checked={settingsDraft.allowSignup} onChange={(v) => setSettingsDraft({ ...settingsDraft, allowSignup: v })} label="Permitir registros nuevos" hint="Si lo apagas, nadie más puede crear cuenta" />
                      <Toggle isDark={isDark} checked={settingsDraft.showPrices} onChange={(v) => setSettingsDraft({ ...settingsDraft, showPrices: v })} label="Mostrar precios" hint="En el catálogo y en el probador" />
                      <Toggle isDark={isDark} checked={settingsDraft.aiEnabled} onChange={(v) => setSettingsDraft({ ...settingsDraft, aiEnabled: v })} label="Permitir generación con IA" hint="Muestra el botón de clave de Gemini" />
                      <Toggle isDark={isDark} checked={settingsDraft.autoFitDefault} onChange={(v) => setSettingsDraft({ ...settingsDraft, autoFitDefault: v })} label="Ajuste automático encendido" hint="Estado inicial en el probador" />
                      <Toggle isDark={isDark} checked={settingsDraft.removeBgDefault} onChange={(v) => setSettingsDraft({ ...settingsDraft, removeBgDefault: v })} label="Quitar fondo encendido" hint="Estado inicial en el probador" />
                    </div>

                    <div className="flex justify-end">
                      <button type="submit" disabled={savingSettings} className="px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 disabled:opacity-60 text-white text-xs font-bold">
                        {savingSettings ? 'Guardando...' : 'Guardar ajustes'}
                      </button>
                    </div>

                    <div className="pt-4 border-t border-dashed border-gray-500/20 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                      <div>
                        <p className="text-xs font-semibold">Restaurar catálogo base</p>
                        <p className="text-[11px] text-gray-400">Vuelve a subir las 9 prendas de ejemplo. No borra las prendas que agregaste.</p>
                      </div>
                      <button type="button" onClick={seedCatalog} disabled={seeding} className={`shrink-0 px-4 py-2 rounded-xl text-xs font-semibold ${isDark ? 'bg-white/10 hover:bg-white/20' : 'bg-black/5 hover:bg-black/10'}`}>
                        {seeding ? 'Subiendo...' : 'Restaurar catálogo base'}
                      </button>
                    </div>
                  </form>
                )}
              </div>
            )}
          </main>

          <footer className="z-10 py-4 text-center text-[11px] text-gray-500">
            {settings.storeName} · Versión 10 (malla TPS: la tela sigue el cuerpo)
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
